<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOODZFLIX</title>
  <meta name="description" content="MOODZFLIX: los videos de WOODZ en un solo lugar. Music videos, variedades, vlogs y conciertos.">
  <meta name="theme-color" content="#0a0a0a">

  <meta property="og:type" content="website">
  <meta property="og:title" content="MOODZFLIX">
  <meta property="og:description" content="Los videos de WOODZ en un solo lugar, hecho por MOODZ.">
  <meta property="og:locale" content="es_ES">

  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/vendor/papaparse.min.js" defer></script>
  <script type="module" src="js/moodzflix/main.js"></script>
</head>
<body class="min-h-dvh">
  <a href="#filas" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded focus:bg-texto focus:px-4 focus:py-2 focus:text-fondo">
    Saltar a los videos
  </a>

  <!-- Cabecera (RF-24) -->
  <header id="cabecera" class="cabecera fixed inset-x-0 top-0 z-40">
    <div class="flex h-14 items-center justify-between gap-4 px-4 sm:h-16 sm:px-10">
      <a href="#" class="text-xl font-extrabold tracking-tight sm:text-2xl">MOODZFLIX</a>
      <nav id="navegacion" aria-label="Categorías" class="hidden items-center gap-1 rounded-full bg-superficie p-1 text-sm font-medium lg:flex"></nav>
      <a href="index.html" class="inline-flex min-h-10 items-center gap-2 rounded-full px-3 text-sm font-medium text-texto-suave transition hover:text-texto">
        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        WOODZ Archive
      </a>
    </div>
  </header>

  <main>
    <!-- Destacado (RF-25) -->
    <section id="destacado" class="relative isolate flex h-[78svh] min-h-[32rem] max-h-[56rem] items-end overflow-hidden" aria-labelledby="destacado-titulo">
      <div id="destacado-medio" class="absolute inset-0 -z-10 bg-superficie">
        <img id="destacado-poster" alt="" width="1280" height="720" class="size-full object-cover opacity-0 transition-opacity duration-700">
      </div>
      <div class="absolute inset-0 -z-10 bg-gradient-to-r from-fondo/90 via-fondo/30 to-transparent"></div>
      <div class="absolute inset-x-0 bottom-0 -z-10 h-2/3 bg-gradient-to-t from-fondo via-fondo/60 to-transparent"></div>

      <div class="w-full px-4 pb-28 sm:px-10 sm:pb-36">
        <p class="text-sm font-semibold text-texto-suave">Lo más nuevo</p>
        <h1 id="destacado-titulo" class="mt-2 max-w-3xl text-balance text-4xl font-extrabold leading-[1.05] tracking-tight sm:text-6xl">
          <span class="esqueleto inline-block h-[1em] w-72 rounded-md align-middle"></span>
        </h1>
        <p id="destacado-descripcion" class="mt-3 max-w-xl text-texto/80 sm:text-lg"></p>
        <div id="destacado-botones" class="mt-6 flex flex-wrap gap-3"></div>
      </div>
    </section>

    <!-- Filas (RF-26, RF-27) -->
    <div id="filas" class="relative z-10 -mt-20 space-y-8 pb-16 sm:-mt-28 sm:space-y-10">
      <div class="flex gap-4 overflow-hidden px-4 sm:px-10" aria-hidden="true">
        <div class="esqueleto aspect-video w-[70vw] shrink-0 rounded-xl sm:w-80"></div>
        <div class="esqueleto aspect-video w-[70vw] shrink-0 rounded-xl sm:w-80"></div>
        <div class="esqueleto aspect-video w-[70vw] shrink-0 rounded-xl sm:w-80"></div>
        <div class="esqueleto aspect-video w-[70vw] shrink-0 rounded-xl sm:w-80"></div>
      </div>
    </div>
  </main>

  <!-- Pie (RF-33) -->
  <footer class="border-t border-linea">
    <div class="flex flex-col gap-3 px-4 py-10 text-sm text-texto-suave sm:px-10">
      <p class="text-base font-extrabold tracking-tight text-texto">MOODZFLIX</p>
      <p class="max-w-xl">Sitio hecho por fans. No es oficial ni tiene relación con WOODZ ni con su agencia. Los videos se reproducen desde YouTube y pertenecen a sus dueños.</p>
      <div data-creditos>
        <span>Créditos: </span><ul id="creditos" class="inline [&>li]:inline [&>li+li]:before:content-[',_']"></ul>
      </div>
      <p>© <span data-anio></span> MOODZ</p>
    </div>
  </footer>

  <!-- Reproductor (RF-28, RF-29) -->
  <dialog id="reproductor" class="reproductor m-auto w-[min(64rem,calc(100vw-2rem),calc((100dvh-8rem)*16/9))] max-w-none overflow-visible bg-transparent p-0 text-texto" aria-labelledby="reproductor-titulo">
    <div class="overflow-hidden rounded-2xl bg-superficie shadow-2xl">
      <div class="relative aspect-video bg-black">
        <iframe id="reproductor-video" class="absolute inset-0 size-full" title="Reproductor de video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3 p-4 sm:px-6">
        <h2 id="reproductor-titulo" class="min-w-0 flex-1 text-lg font-semibold"></h2>
        <div class="flex gap-2">
          <a id="reproductor-youtube" target="_blank" rel="noopener" class="inline-flex min-h-11 items-center gap-2 rounded-full bg-white/10 px-5 text-sm font-semibold transition hover:bg-white/20">Ver en YouTube</a>
          <button id="reproductor-cerrar" type="button" class="inline-flex min-h-11 items-center rounded-full bg-texto px-5 text-sm font-semibold text-fondo transition hover:bg-white">Cerrar</button>
        </div>
      </div>
    </div>
  </dialog>

  <noscript>
    <p class="fixed inset-x-0 bottom-0 bg-acento p-3 text-center text-fondo">MOODZFLIX necesita JavaScript para mostrar los videos.</p>
  </noscript>
</body>
</html>
